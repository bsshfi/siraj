<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>سِراج — لوحة المدير</title>
<style>
:root{--ink:#2B2350;--soft:#6E668F;--bg:#F4F1FF;--card:#fff;--brand:#5B4BDB;--orange:#FF6B1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEE9FF;--soft:#A79FC9;--bg:#120F33;--card:#1F1950}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #0001}
label{display:block;font-weight:700;margin:10px 0 4px}
input,textarea{width:100%;padding:10px 12px;border-radius:12px;border:2px solid #0002;font-size:16px;background:transparent;color:inherit;font-family:inherit}
textarea{min-height:90px}
button{margin-top:12px;padding:12px 16px;border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;font-size:16px;cursor:pointer;width:100%}
button.alt{background:var(--brand)}
.out{font-family:monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;background:#0001;border-radius:10px;padding:10px;margin-top:10px}
.muted{color:var(--soft);font-size:14px}
</style>
</head>
<body><div class="wrap">
<h1>🪔 سِراج — لوحة المدير</h1>

<div class="card">
  <label>رابط السيرفر</label><input id="api" placeholder="https://siraj-api.bsshfi.workers.dev">
  <label>مفتاح المدير (ADMIN_KEY)</label><input id="key" type="password">
  <button class="alt" onclick="stats()">الإحصائيات</button>
  <div class="out" id="statsOut">—</div>
</div>

<div class="card">
  <h2 style="margin:0">رسالة لكل المستخدمين</h2>
  <p class="muted">تصل لكل جهاز فعّل الإشعارات.</p>
  <label>العنوان</label><input id="title" value="سِراج 🌙">
  <label>النص</label><textarea id="body" placeholder="عيدكم مبارك! جهّزنا لكم قصص العيد ✨"></textarea>
  <button onclick="send()">إرسال للكل</button>
  <div class="out" id="sendOut">—</div>
</div>

<div class="card">
  <h2 style="margin:0">توليد مفاتيح الإشعارات (VAPID)</h2>
  <p class="muted">مرة وحدة بس. انسخ المفتاحين للسيرفر، وضع العام في config.js. أو استخدم نفس مفاتيح push-wamdarc إذا كانت بنفس الصيغة.</p>
  <button class="alt" onclick="gen()">توليد</button>
  <div class="out" id="genOut">—</div>
</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
try { $('api').value = localStorage.getItem('siraj-admin-api') || 'https://siraj-api.bsshfi.workers.dev'; $('key').value = localStorage.getItem('siraj-admin-key') || ''; } catch (e) {}
function keep() { try { localStorage.setItem('siraj-admin-api', $('api').value.trim()); localStorage.setItem('siraj-admin-key', $('key').value.trim()); } catch (e) {} }
async function call(path, opts = {}) {
  keep();
  const r = await fetch($('api').value.trim().replace(/\/$/, '') + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': $('key').value.trim() } });
  return r.json();
}
async function stats() { try { $('statsOut').textContent = JSON.stringify(await call('/stats'), null, 2); } catch (e) { $('statsOut').textContent = 'خطأ: ' + e.message; } }
async function send() {
  if (!$('body').value.trim()) return;
  if (!confirm('إرسال الرسالة لكل المستخدمين؟')) return;
  try { $('sendOut').textContent = JSON.stringify(await call('/broadcast', { method: 'POST', body: JSON.stringify({ title: $('title').value, body: $('body').value }) }), null, 2); } catch (e) { $('sendOut').textContent = 'خطأ: ' + e.message; }
}
async function gen() {
  const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  const raw = new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey));
  const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
  const b64u = (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  $('genOut').textContent = 'VAPID_PUBLIC:\n' + b64u(raw) + '\n\nVAPID_PRIVATE:\n' + jwk.d;
}
</script>
</body>
</html>
