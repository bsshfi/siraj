# سراج | Siraj — لقطات شاشة آلية من محاكي أندرويد (للمقارنة مع نسخة الويب)
# يشتغل مع كل تعديل على واجهة التطبيق في فرع flutter
name: Screens

on:
  push:
    branches: [flutter]
    paths: ['flutter/lib/**', 'flutter/tool/**', '.github/workflows/screens.yml']
  workflow_dispatch:

concurrency:
  group: screens
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز
        run: |
          node tool/export.cjs
          flutter create --org com.wamdarc --project-name siraj --platforms android .
          rm -rf test
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: بناء نسخة العرض
        run: flutter build apk --release --build-number=999 --build-name=2.3.0 --dart-define=DEMO=true
      - name: KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: اللقطات
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: flutter
          script: bash tool/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: flutter/shots/
