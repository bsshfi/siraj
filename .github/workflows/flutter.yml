# سراج | Siraj — التطبيق الأصلي (Flutter)
# يشتغل فقط على فرع flutter. يبني APK ويرفعه على الرابط الثابت للنسخة التجريبية.
name: Flutter app

on:
  push:
    branches: [flutter]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # مفتاح رفع Google Play (يضيفه باسل في Settings → Secrets → Actions)
      SIRAJ_KEYSTORE_BASE64: ${{ secrets.SIRAJ_KEYSTORE_BASE64 }}
      SIRAJ_KEYSTORE_PASSWORD: ${{ secrets.SIRAJ_KEYSTORE_PASSWORD }}
      SIRAJ_KEY_ALIAS: ${{ secrets.SIRAJ_KEY_ALIAS }}
      SIRAJ_KEY_PASSWORD: ${{ secrets.SIRAJ_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تصدير القصص والرسومات من نسخة الويب
        run: node tool/export.cjs

      - name: تجهيز مشروع الأندرويد
        run: |
          flutter create --org com.wamdarc --project-name siraj --platforms android .
          rm -rf test
          python3 tool/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: بناء APK
        run: |
          BN=$((100 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number=$BN --build-name=2.3.0 || (sleep 45; flutter build apk --release --build-number=$BN --build-name=2.3.0)
          cp build/app/outputs/flutter-apk/app-release.apk siraj-test.apk
          echo "BN=$BN" >> "$GITHUB_ENV"

      - name: نشر النسخة التجريبية على الرابط الثابت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --target "${GITHUB_SHA}" --prerelease --title "سراج | Siraj — نسخة تجريبية للأندرويد" --notes "آخر نسخة تجريبية."
          gh release upload android-test siraj-test.apk --clobber
          gh release edit android-test --notes "آخر نسخة تجريبية (Flutter) — رقم البناء ${BN}"

      # ---- نسخة متجر Google Play (AAB موقّع بمفتاح الرفع) — تنبني بس لو المفاتيح موجودة ----
      - name: بناء نسخة Google Play (AAB)
        if: env.SIRAJ_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIRAJ_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          export SIRAJ_PLAY=1
          flutter build appbundle --release --build-number=$BN --build-name=2.3.0 --dart-define=STORE=play || (sleep 45; flutter build appbundle --release --build-number=$BN --build-name=2.3.0 --dart-define=STORE=play)
          cp build/app/outputs/bundle/release/app-release.aab siraj-play-$BN.aab
          rm -f android/app/upload.jks

      - name: نشر ملف المتجر
        if: env.SIRAJ_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view play-store >/dev/null 2>&1 || \
            gh release create play-store --target "${GITHUB_SHA}" --prerelease --title "سراج | Siraj — ملف Google Play" --notes "ملف AAB للرفع على Google Play Console."
          for f in $(gh release view play-store --json assets -q '.assets[].name'); do gh release delete-asset play-store "$f" -y; done
          gh release upload play-store siraj-play-$BN.aab --clobber
          gh release edit play-store --notes "ملف Google Play — رقم البناء ${BN} — الإصدار 2.3.0"
